<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolutions-Arena · Options-Desk Agentenkette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE work: ein Handelsdesk, dicht, nüchtern, präzise
   IDEA das Leitstand-Pult eines Optionshändlers: Ampeln, Messstreifen, Tickets
   PICTURE Trade-Tickets mit großem Auszahlungsprofil (Gewinn/Verlust über Kurs, Walls, Spot)
   COLOUR Stahlgrau-Pult, Schwarz, Weiß, Alarmrot; Grün nur für Gewinnzonen
   TYPE Inter Tight 600 Titel + Inter Text
   LAYOUT oben Befund + Kennzahlen-Streifen, darunter Tickets in zwei Spalten; Telefon: eine Spalte */
:root{color-scheme:light dark;--bg:light-dark(#d5dbe0,#16191c);--panel:light-dark(#ffffff,#1f2327);--ink:light-dark(#0b0c0d,#eef1f3);--mute:light-dark(#4d565e,#9aa4ad);--line:light-dark(#b9c1c8,#2f353b);--red:#e8251a;--grn:light-dark(#0f7a3d,#3ccf7a);--amb:light-dark(#9a6a00,#f0b429);--blu:light-dark(#1d4ed8,#7aa2ff);--soft:light-dark(#eef1f3,#262b30)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.08;margin:0}
h1{font-size:clamp(26px,3.4vw,40px);text-wrap:balance}
h2{font-size:22px;margin-bottom:12px}
h3{font-size:17px}
.wrap{max-width:1280px;margin:0 auto;padding:0 max(16px,3vw)}
header{background:var(--ink);color:var(--bg)}
header .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;padding-top:12px;padding-bottom:12px}
header b{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:18px}
header span{color:color-mix(in srgb,var(--bg) 70%,transparent);font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav a{flex:none;padding:12px 14px;color:var(--mute);text-decoration:none;font-weight:500;border-bottom:3px solid transparent;min-height:44px}
nav a.on{color:var(--ink);border-color:var(--red)}
.hero{padding:22px 0 10px;display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--panel);padding:10px 12px}
.kpi small{display:block;color:var(--mute);font-size:13px}
.kpi b{font:600 22px "Inter Tight",Inter,system-ui,sans-serif;white-space:nowrap}
.kpi i{font-style:normal;font-size:13px;color:var(--mute);margin-left:6px;white-space:nowrap}
section{display:none;padding:8px 0 40px}
section.on{display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);padding:16px}
.tk{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:8px}
.tk h3{font-size:24px}
.chip{display:inline-block;padding:2px 9px;font-size:13px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--grn)}.warn{color:var(--amb)}.bad{color:var(--red)}.mute{color:var(--mute)}
.fig{position:relative;height:210px;margin:6px 0 10px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig.tall{height:300px}.fig.big{height:500px}.grid1{display:grid;gap:16px}.rng{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 10px}.rng>span{color:var(--mute);font-size:13px;margin-right:4px}.rng button{font:500 14px Inter,sans-serif;min-height:40px;padding:6px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}.rng button:disabled{opacity:.5}.take{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:10px 0}.take label{font-size:13px;color:var(--mute);display:grid;gap:2px}.take input{font:16px Inter;padding:8px;min-height:44px;width:8em;border:1px solid var(--line);background:var(--panel);color:var(--ink)}.take button{font:600 14px Inter;min-height:44px;padding:8px 16px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}.take button:disabled{opacity:.5}.rng button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
svg text{font:12px Inter,sans-serif;fill:var(--mute);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5em,1fr));gap:6px 12px;margin:8px 0}
.nums div small{display:block;color:var(--mute);font-size:13px}
.nums div b{font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:500;cursor:pointer;user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
ul.chk{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
ul.chk li{padding:3px 0 3px 22px;position:relative}
ul.chk li::before{content:attr(data-s);position:absolute;left:0;font-weight:700}
.src{font-size:13px;color:var(--mute)}
details{margin-top:8px}summary{cursor:pointer;color:var(--blu);min-height:32px}
.bar{height:8px;background:var(--soft);position:relative}
.bar i{position:absolute;top:0;bottom:0;background:var(--ink)}
select{font:16px Inter;padding:8px;min-height:44px;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.heat td{text-align:right}
.empty{padding:24px;text-align:center;color:var(--mute)}
.note{white-space:pre-wrap;font-size:15px}
@media(max-width:600px){.fig.big{height:380px}th,td{padding:5px 4px}.tk h3{font-size:20px}.kpi i{display:block;margin:0;white-space:normal}.kpi b{font-size:20px}}
</style>
</head>
<body>
<header><div class="wrap"><b>Evolutions-Arena · Agentennetze</b><span id="meta">lädt …</span></div></header>
<nav id="nav" class="scroll"></nav>
<div class="wrap">
<div class="hero"><h1 id="finding">Daten werden geladen …</h1><div class="kpis" id="kpis"></div></div>
<section id="ideen"></section><section id="positionen"></section><section id="richtung"></section><section id="markt"></section><section id="strategien"></section><section id="forschung"></section><section id="optimierung"></section><section id="evolution"></section>
<p class="src">Quantitative Analyse aus öffentlichen Daten (DoltHub, Cboe 15 min verzögert, FRED, Yahoo). Keine Anlageberatung.</p>
</div>
<script>
{
const TABS=[["evolution","Evolution"]];
const $=s=>document.querySelector(s);
const pct=(x,d=1)=>x==null||isNaN(x)?"–":(x*100).toFixed(d)+" %";
const sp=(x,d=1)=>x==null||isNaN(x)?"–":(x>0?"+":"")+(x*100).toFixed(d)+" %";
const num=(x,d=2)=>x==null||isNaN(x)?"–":Number(x).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=x=>x==null?"–":Number(x).toLocaleString("de-DE",{maximumFractionDigits:0})+" $";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vcls=v=>({"freigegeben":"ok","bestätigt":"ok","passt":"ok","ok":"ok","Vorsicht":"warn","Kandidat":"warn","neutral":"warn","halbe Größe":"warn"}[v]||"bad");
const BIAS={bull:"bullisch",bear:"bärisch",neutral:"neutral"};
let D=null;const draws=[];const LIVE=[];let RANGE=126;const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function fig(cls,fn){const id="f"+Math.random().toString(36).slice(2);draws.push([id,fn]);return `<div class="fig ${cls||""}"><svg id="${id}"></svg></div>`}
function mount(){for(const [id,fn] of draws.splice(0)){const s=document.getElementById(id);if(!s)continue;const r=()=>{try{fn(s,s.clientWidth,s.clientHeight)}catch(e){console.log(e)}};LIVE.push(r);const ro=new ResizeObserver(r);ro.observe(s)}}
window.setRange=n=>setRange(n);
function setRange(n){RANGE=n;document.querySelectorAll(".rng button").forEach(b=>b.classList.toggle("on",+b.dataset.n===n));LIVE.forEach(f=>f())}
function rangeBar(){return `<div class="rng"><span>Zeitraum</span>${[[63,"3 Monate"],[126,"6 Monate"],[250,"1 Jahr"]].map(([n,l])=>`<button type="button" data-n="${n}" class="${n===RANGE?"on":""}" onclick="setRange(${n})">${l}</button>`).join("")}<span class="src">Tageskerzen · 1 Kerze = 1 Handelstag</span></div>`}
function lineChart(s,W,H,series,o={}){
  const m={l:46,r:o.r??14,t:12,b:24};const all=series.flatMap(x=>x.pts);if(!all.length){s.innerHTML="";return}
  const xs=all.map(p=>+new Date(p[0])),ys=all.map(p=>p[1]);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys,o.zero?0:Infinity),y1=Math.max(...ys,o.zero?0:-Infinity);if(y0===y1){y0-=1;y1+=1}
  const X=v=>m.l+(+new Date(v)-x0)/(x1-x0||1)*(W-m.l-m.r),Y=v=>m.t+(1-(v-y0)/(y1-y0))*(H-m.t-m.b);
  let g="";const nt=W<520?3:5;for(let i=0;i<=nt;i++){const v=y0+(y1-y0)*i/nt;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${o.fmt?o.fmt(v):num(v,1)}</text>`}
  const yrs=[...new Set(all.map(p=>p[0].slice(0,4)))];yrs.forEach((y,i)=>{if(W<520&&i%2)return;const t=X(y+"-01-01");if(t>m.l&&t<W-m.r)g+=`<text x="${t}" y="${H-6}" text-anchor="middle">${y}</text>`});
  if(o.split){const t=X(o.split);g+=`<line x1="${t}" x2="${t}" y1="${m.t}" y2="${H-m.b}" stroke="var(--mute)" stroke-dasharray="3 3"/><text x="${t+4}" y="${m.t+10}">Out-of-Sample →</text>`}
  if(o.zero)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink)" stroke-width=".8"/>`;
  for(const se of series){g+=`<polyline fill="none" stroke="${se.c}" stroke-width="${se.w||2}" points="${se.pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}"/>`}
  s.innerHTML=g}
function payoff(s,W,H,i){
  const c=i.payoff.curve;if(!c||!c.length){s.innerHTML="";return}const m={l:50,r:12,t:16,b:24};
  const xs=c.map(p=>p[0]),ys=c.map(p=>p[1]*100);const x0=xs[0],x1=xs[xs.length-1];let y0=Math.min(...ys,0),y1=Math.max(...ys,0);const pad=(y1-y0)*.1;y0-=pad;y1+=pad;
  const X=v=>m.l+(v-x0)/(x1-x0)*(W-m.l-m.r),Y=v=>m.t+(1-(v-y0)/(y1-y0))*(H-m.t-m.b);
  let g="";const z=Y(0);
  const pts=c.map(p=>[X(p[0]),Y(p[1]*100)]);
  g+=`<clipPath id="u${s.id}"><rect x="0" y="0" width="${W}" height="${z}"/></clipPath><clipPath id="d${s.id}"><rect x="0" y="${z}" width="${W}" height="${H}"/></clipPath>`;
  const area=`M${pts[0][0]},${z} `+pts.map(p=>`L${p[0]},${p[1]}`).join(" ")+` L${pts[pts.length-1][0]},${z}Z`;
  g+=`<path d="${area}" fill="var(--grn)" opacity=".18" clip-path="url(#u${s.id})"/><path d="${area}" fill="var(--red)" opacity=".16" clip-path="url(#d${s.id})"/>`;
  g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${z}" y2="${z}" stroke="var(--ink)" stroke-width=".8"/>`;
  g+=`<polyline fill="none" stroke="var(--ink)" stroke-width="2.2" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  [y1-pad,0,y0+pad].forEach(v=>g+=`<text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${usd(v)}</text>`);
  const mk=(v,lab,col,row)=>{if(v==null||v<x0||v>x1)return;const t=X(v);g+=`<line x1="${t}" x2="${t}" y1="${m.t}" y2="${H-m.b}" stroke="${col}" stroke-dasharray="${col==="var(--ink)"?"":"4 3"}"/><text x="${t}" y="${row?H-6:m.t-3}" text-anchor="middle" style="fill:${col}">${lab}</text>`};
  mk(i.spot,"Kurs "+num(i.spot,2),"var(--ink)",0);
  if(i.gex){mk(i.gex.put_wall,"Put-Wall","var(--red)",1);mk(i.gex.call_wall,"Call-Wall","var(--blu)",1)}
  s.innerHTML=g}
function candle(s,W,H,t,extra){
  const P=D.price?.[t],c0=P?.chart;if(!c0||!c0.c){s.innerHTML=`<text x="12" y="20">keine Kursdaten</text>`;return}
  const k0=Math.max(0,c0.c.length-RANGE),c={};for(const key of ["d","o","h","l","c","s50","s200"])c[key]=(c0[key]||[]).slice(k0);
  const g=D.gex?.[t];const m={l:8,r:W<520?84:128,t:22,b:22};const n=c.c.length;
  const lv=[];if(g){if(g.call_wall)lv.push({v:g.call_wall,l:"Call-Wall",c:"var(--blu)",d:"6 3"});if(g.put_wall)lv.push({v:g.put_wall,l:"Put-Wall",c:"var(--red)",d:"6 3"});if(g.flip)lv.push({v:g.flip,l:"Gamma-Flip",c:"var(--amb)",d:"2 3"})}
  (P.supports||[]).slice(0,2).forEach(x=>lv.push({v:x[0],l:"Unterst.",c:"var(--mute)",d:"1 3"}));(P.resistances||[]).slice(0,2).forEach(x=>lv.push({v:x[0],l:"Widerst.",c:"var(--mute)",d:"1 3"}));
  (extra||[]).forEach(x=>lv.push(x));
  let lo=Math.min(...c.l),hi=Math.max(...c.h);const near=lv.filter(x=>x.v>lo*0.85&&x.v<hi*1.15);near.forEach(x=>{lo=Math.min(lo,x.v);hi=Math.max(hi,x.v)});const pd=(hi-lo)*.04;lo-=pd;hi+=pd;
  const X=i=>m.l+(i+.5)/n*(W-m.l-m.r),Y=v=>m.t+(1-(v-lo)/(hi-lo))*(H-m.t-m.b),bw=Math.max(1.5,(W-m.l-m.r)/n*.62);
  let h="";for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;h+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width=".6"/>`}
  let pm="";c.d.forEach((d,i)=>{const mm=d.slice(5,7);if(mm!==pm&&i>0){h+=`<line x1="${X(i)}" x2="${X(i)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--line)" stroke-width=".5"/>`;if(!(W<520&&(+mm)%2))h+=`<text x="${X(i)}" y="${H-5}" text-anchor="middle">${MON[+mm-1]}${mm==="01"?" "+d.slice(2,4):""}</text>`}pm=mm});
  const fd=x=>x.slice(8,10)+"."+x.slice(5,7)+"."+x.slice(2,4);h+=`<text x="${m.l}" y="14" style="fill:var(--ink)">Tageskerzen · ${fd(c.d[0])} – ${fd(c.d[n-1])} (${n} Handelstage)</text>`;
  const PT=D.patterns?.now?.[t];const xd=d=>{let k=c.d.indexOf(d);if(k>=0)return X(k);if(d<c.d[0])return null;k=c.d.findIndex(z=>z>d);return k<0?X(n-1):X(k)};
  const ZC={demand:"var(--grn)",fvg_bull:"var(--grn)",supply:"var(--red)",fvg_bear:"var(--red)",gap:"var(--mute)",flag:"var(--blu)",range:"var(--blu)"};
  if(PT){for(const z of [...(PT.zones||[]),...(PT.gaps||[])]){if(z.hi<lo||z.lo>hi)continue;const x0=z.o!=null?(z.o>n-1?m.l:X(n-1-z.o)):(xd(z.d)??m.l);h+=`<rect x="${x0}" width="${Math.max(2,W-m.r-x0)}" y="${Y(Math.min(z.hi,hi))}" height="${Math.max(1,Y(Math.max(z.lo,lo))-Y(Math.min(z.hi,hi)))}" fill="${ZC[z.kind]||"var(--mute)"}" opacity=".13"/>`}}
  for(let i=0;i<n;i++){const up=c.c[i]>=c.o[i],col=up?"var(--grn)":"var(--red)";h+=`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(c.h[i])}" y2="${Y(c.l[i])}" stroke="${col}"/><rect x="${X(i)-bw/2}" width="${bw}" y="${Y(Math.max(c.o[i],c.c[i]))}" height="${Math.max(1,Math.abs(Y(c.o[i])-Y(c.c[i])))}" fill="${col}"/>`}
  const ln=(arr,col)=>{const p=arr.map((v,i)=>v==null?null:`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean);if(p.length)h+=`<polyline fill="none" stroke="${col}" stroke-width="1.3" points="${p.join(" ")}"/>`};
  if(PT){const xo=o=>X(n-1-o);
    const seg=(L,col,dash,w,lab)=>{let x0,x1,y0=L.p[0][1],y1=L.p[1][1];
      if(L.o){let [o0,o1]=L.o;if(o1>n-1)return;if(o0>n-1){y0=y0+(y1-y0)*(o0-(n-1))/Math.max(o0-o1,1);o0=n-1}x0=xo(o0);x1=xo(o1)}
      else{x0=xd(L.p[0][0]);x1=xd(L.p[1][0]);if(x1==null)return;if(x0==null)x0=m.l}
      if((y0<lo&&y1<lo)||(y0>hi&&y1>hi))return;
      h+=`<line x1="${x0}" y1="${Y(Math.min(Math.max(y0,lo),hi))}" x2="${x1}" y2="${Y(Math.min(Math.max(y1,lo),hi))}" stroke="${col}" stroke-width="${w||1.8}" ${dash?'stroke-dasharray="6 4"':""}/>`;
      if(lab&&y1>=lo&&y1<=hi)h+=`<text x="${x1-4}" y="${Y(y1)-5}" text-anchor="end" style="fill:${col}">${lab}</text>`};
    (PT.gaps||[]).forEach(g=>{if(g.hi<lo||g.lo>hi)return;const x0=g.o!=null?(g.o>n-1?m.l:xo(g.o)):(xd(g.d)??m.l);h+=`<text x="${x0+3}" y="${Y(Math.min(g.hi,hi))+12}" style="fill:var(--mute)">Gap ${num(g.lo)}–${num(g.hi)}</text>`});
    (PT.trendlines||[]).forEach(L=>seg(L,L.kind==="trend_up"?"var(--grn)":"var(--red)",L.broken,L.term==="mittel"?2.4:1.5,(L.term==="mittel"?"TL lang":"TL")+(L.broken?" gebr.":"")));
    (PT.recent||[]).forEach(e=>{(e.draw||[]).forEach(o=>{if(o.type==="line")seg(o,"var(--amb)",true);if(o.type==="mark"){const x=xd(o.d);if(x!=null)h+=`<text x="${x}" y="${Y(o.y)-6}" text-anchor="middle" style="fill:var(--amb);font-weight:600">${esc(o.text)}</text>`}});
      const x=xd(e.date);if(x==null)return;const yy=e.dir>0?Y(Math.min(...c.l.slice(Math.max(0,c.d.indexOf(e.date)))))+14:Y(Math.max(...c.h.slice(Math.max(0,c.d.indexOf(e.date)))))-8;
      const col=e.status==="bestätigt"||e.status==="Kandidat"?(e.dir>0?"var(--grn)":"var(--red)"):"var(--mute)";h+=`<text x="${x}" y="${yy}" text-anchor="middle" style="fill:${col};font-weight:600">${e.dir>0?"▲":"▼"}</text>`})}
  ln(c.s50||[],"var(--blu)");ln(c.s200||[],"var(--ink)");
  const sorted=near.map(x=>({...x,y:Y(x.v)})).sort((a,b)=>a.y-b.y);let last=-99;for(const x of sorted){x.ty=Math.max(x.y,last+13);last=x.ty}
  for(const x of sorted){h+=`<line x1="${m.l}" x2="${W-m.r+4}" y1="${x.y}" y2="${x.y}" stroke="${x.c}" stroke-dasharray="${x.d||""}" stroke-width="${x.w||1.1}"/><text x="${W-m.r+8}" y="${x.ty+4}" style="fill:${x.c}">${x.l} ${num(x.v,x.v>=100?0:2)}</text>`}
  const lc=c.c[n-1];h+=`<text x="${X(n-1)-4}" y="${Y(lc)-8}" text-anchor="end" style="fill:var(--ink);font-weight:600">${num(lc)}</text>`;
  s.innerHTML=h}
function gexBars(s,W,H,t){const g=D.gex?.[t];const p=g?.profile||[];if(!p.length){s.innerHTML=`<text x="12" y="20">keine Gamma-Daten</text>`;return}
  const m={l:46,r:10,t:14,b:22};const x0=p[0][0],x1=p[p.length-1][0],mx=Math.max(...p.map(x=>Math.abs(x[1])))||1;const X=v=>m.l+(v-x0)/(x1-x0||1)*(W-m.l-m.r),Y=v=>m.t+(1-(v+mx)/(2*mx))*(H-m.t-m.b);const bw=Math.max(1.5,(W-m.l-m.r)/p.length*.7);

  return slim({heute:D.live_day,konto:D.account,risiko:D.risk,vorschlag:idea,trigger_backtest:trig,preisaktion:(D.price||{})[t],
    makro:{regime:D.macro?.regime,markt:D.macro?.market},termine:(E.calendar||[]).filter(e=>e.bdays>=0).slice(0,12),nachrichten:E.news,
    sec_insider:(D.filings?.now||{})[t]||[],google_trends:(D.social?.trends?.now||[]).find(z=>z.ticker===t)||null,
    lernmodul:{gewichte:D.learn?.weights,notiz:D.learn?.note},offene_positionen:(D.positions?.positions||[]).filter(p=>p.ticker===t)})}
const ASK_SYS=`Du bist das Agentennetzwerk der Options-Agentenkette von Markus (Agenten 0–11: Trigger-Forschung, Ticker-Regeln, Live-Trades mit Gamma-Strikes, Preisaktion, Makro, Dashboard, Positionen, Chartmuster, Termine & Nachrichten, Posts & Google Trends, SEC-Filings, Supervisor mit Lernmodul). Beantworte die Frage zu GENAU diesem Vorschlag auf Deutsch, knapp (max. ~180 Wörter), konkret mit Zahlen.
Regeln: Nutze ausschließlich die mitgegebenen Daten (JSON) und die Werkzeuge; erfinde keine Kurse, Quotes, Studien oder Backtest-Ergebnisse. Wenn eine Antwort einen neuen Backtest oder Live-Daten bräuchte, die nicht vorliegen, sag das klar und empfiehl „im Abendlauf vertiefen“. Nenne, welcher Agent welchen Befund liefert. Weise auf Risiken hin (Termine, Gamma, Liquidität), keine Anlageberatung, Markus entscheidet.`;
async function ask(box){const q=box.querySelector("textarea").value.trim(),out=box.querySelector(".ans"),btn=box.querySelector("button[data-ask]");
  if(!q){out.innerHTML='<span class="bad">Bitte zuerst eine Frage eingeben.</span>';return}
  const kind=box.dataset.kind,key=box.dataset.key,deep=box.querySelector("[data-deep]").checked;const ctx=askContext(kind,key);
  btn.disabled=true;out.textContent="Die Agenten denken nach …";
  let sample=null;try{sample=window.claude?.use?await window.claude.use("sample"):null}catch(e){sample=null}
  let answer="";
  if(sample){try{const r=await sample([{role:"user",content:ASK_SYS+"\n\nDATEN:\n"+JSON.stringify(ctx)+"\n\nFRAGE VON MARKUS:\n"+q}],{modelTier:"complex",cache:false,
      tools:[{name:"ticker_daten",description:"Preisaktion, Chartmuster und GEX-Daten eines anderen Tickers aus dem Dashboard",inputSchema:{type:"object",properties:{ticker:{type:"string"}},required:["ticker"]},execute:({ticker})=>slim({preisaktion:(D.price||{})[ticker?.toUpperCase()],ideen:(D.ideas||[]).filter(i=>i.ticker===ticker?.toUpperCase()).map(i=>({strategie:i.strategy_name,final:i.final,checks:i.checks}))})},
             {name:"strategie_backtests",description:"Backtest-Kennzahlen aller Trigger, Chartmuster, SEC- und Trends-Signale",inputSchema:{type:"object",properties:{}},execute:()=>slim({trigger:(D.triggers||[]).map(t=>({id:t.id,name:t.name,status:t.status,oos:t.oos})),sec:D.filings?.tests,trends:D.social?.trends?.tests})}],
      onText:({text})=>{answer=text;out.textContent=text}});answer=r.text;out.textContent=answer}
    catch(e){out.textContent=e?.code==="not_granted"?"Live-Antwort nicht freigegeben – Frage wird im Abendlauf beantwortet.":"Live-Antwort gerade nicht möglich ("+(e?.code||"Fehler")+") – Frage wird im Abendlauf beantwortet."}}
  else out.textContent="Live-Antwort hier nicht verfügbar – Frage wird im Abendlauf beantwortet.";
  try{if(DB){await DB.collection("questions").add({created:new Date().toISOString(),kind,key,question:q.slice(0,2000),answer:(answer||"").slice(0,6000),deep:deep||!answer,status:(deep||!answer)?"offen":"beantwortet",day:D.live_day});
      out.insertAdjacentHTML("beforeend",`<p class="src">${(deep||!answer)?"Gespeichert – der Abendlauf prüft die Frage mit eigenen Daten/Backtests und antwortet im Reiter Agenten-Log.":"Gespeichert."}</p>`)}}catch(e){}
  btn.disabled=false}
document.addEventListener("click",e=>{const b=e.target.closest("button[data-ask]");if(b)ask(b.closest(".ask"))});
document.addEventListener("click",e=>{const b=e.target.closest("button[data-take]");if(b)takePosition(b.closest(".take"))});
if(window.claude?.use)window.claude.use("db").then(db=>{if(db)DB=db}).catch(()=>{});
}
</script>
