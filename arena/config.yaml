# Evolutions-Arena – feste Spielregeln (gelten für alle Netze, nur Markus ändert sie)
account: 100000            # Startkapital je Netz (simuliert)
max_risk_per_trade: 0.10   # max. Verlust je Trade 10 % des Kontos (Markus, 24.11.2026); kein Gesamtlimit, aber keine negative Kaufkraft
max_position_frac: 2.0     # Aktienposition max. 200 % des Kontos (Margin, Reg-T)
margin:                    # Margin realistisch wie bei einem US-Broker (Markus, 24.11.2026)
  overnight_leverage: 2.0  # Reg-T: Kaufkraft über Nacht = 2 × Kontowert
  intraday_leverage: 4.0   # Intraday-Positionen (exit "close"): 4 ×
  rate_spread: 0.015       # Sollzins = Fed Funds (FRED DFF) + 1,5 % p. a. auf negative Kasse, taggenau /360
  short_borrow: 0.003      # Leihgebühr Leerverkäufe 0,3 % p. a. auf den Kurswert
  maintenance: 0.25        # Margin Call: Kontowert < 25 % des Brutto-Aktienexposures → Zwangsschließung (größte zuerst)
max_drawdown_stop: 0.30    # fällt ein Netz 30 % unter seinen Höchststand: alles schließen, kein neuer Handel bis zur Auswahl
cohort_size: 10            # neue Netze je Woche (anfangs 5 Klon-Netze + 5 freie Netze)
cohort_days: 30            # Lebensdauer bis zur Auswahl (Kalendertage, nur zur Planung)
cohort_trading_days: 21    # Auswahl nach 21 aktiven Handelstagen (≈ 30 Kalendertage); Pausen zählen nicht
think_max_age_days: 9      # ohne Claude-Denk-Lauf länger als 9 Tage → Arena pausiert (kein neuer Handel, Uhr steht)
survivors: 5               # die besten 5 einer Kohorte werden je 2× geklont, die schlechtesten 5 eliminiert
min_dd_for_score: 0.02     # Score = Rendite / max(Max-Drawdown, 2 %)  (Rendite pro Risiko)
min_trades_to_win: 2       # Netze mit weniger Trades können nicht unter die Besten kommen
controls: [markus, zufall, spy]   # je Kohorte: Regeln von Markus' Netz (eingefroren), Zufall, SPY kaufen und halten
degrade_rounds: 2          # so viele Runden in Folge signifikant schlechter → Warnung + Analyse/Anweisungen
rollback_after: 3          # danach weiterhin schlechter → Rücksprung zur besten Runde
