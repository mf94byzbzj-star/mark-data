name: Arena – Signale und Netze (täglich)
on:
  workflow_run:
    workflows: ["Agentenkette – Tagesdaten"]
    types: [completed]
  push:
    paths: ["arena/.run"]
  workflow_dispatch:
concurrency:
  group: arena
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  arena:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r chain/requirements.txt
      - uses: actions/cache@v4
        with:
          path: chain_lab/cache
          key: chainlab-${{ hashFiles('chain/**/*.py', 'chain_lab/research/*.yaml') }}-${{ github.run_id }}
          restore-keys: chainlab-
      - name: Gemeinsame Signale (einmal für alle Netze)
        run: python -m chain.run a1 a2 a10 a11 a9 a3 a8 a4 a5
      - name: Arena-Tageslauf
        run: python -m arena.engine
      - name: Speichern
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add arena chain_lab/out chain_lab/research
          git diff --cached --quiet || git commit -q -m "Arena: Tageslauf $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push -q && break; sleep 5; done
