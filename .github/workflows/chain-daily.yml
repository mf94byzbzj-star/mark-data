name: Agentenkette – Tagesdaten
on:
  schedule:
    - cron: "40 21 * * 1-5"    # 16:40 New York (Winterzeit): Kurse, Cboe-Ketten inkl. OI, FRED, Earnings
  push:
    paths: ["chain_data/.run_daily"]
  workflow_dispatch:
concurrency:
  group: chain-daily
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas pyyaml lxml requests scipy
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          python chain/fetch/fetch.py daily

