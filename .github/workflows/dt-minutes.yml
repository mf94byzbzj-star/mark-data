name: Daytrading – 1-Minuten-Kerzen
on:
  schedule:
    - cron: "40 1 * * 2-6"     # nach US-Nachbörse: Vortag nachladen
  push:
    paths: ["chain_data/.run_dt_minutes"]
  workflow_dispatch:
concurrency:
  group: dt-minutes
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas yfinance
      - run: python chain/fetch/fetch_dt_minutes.py 29
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add chain_data/minute1
          git diff --cached --quiet || git commit -qm "Daten: 1-Minuten-Kerzen $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
