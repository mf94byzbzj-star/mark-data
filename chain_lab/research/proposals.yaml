  title: Backtest auf die tatsächlich gehandelte Struktur abstimmen
  problem: "Live (Agent 3) setzt Short-Strikes an die Gamma-Walls und verengt die Flügel, damit das Risiko je Kontrakt ins 2-%-Budget passt (z. B. AAPL 330/320 statt 325/300). Der Backtest rechnet dagegen mit 25/10-Delta-Spreads. Die Backtest-Kennzahlen beschreiben also nicht exakt den vorgeschlagenen Trade."
  change: "Zusätzliche Backtest-Varianten mit Flügelbreite nach Risikobudget (ca. 1,5–3 % des Kurses) für Put/Call Credit Spreads, Iron Condor und Iron Butterfly; Live nutzt die Kennzahlen der passenden Variante."
  expected: "Erwartungswert, Trefferquote und Positionsgröße passen zum echten Trade."
  evidence: "Supervisor-Prüfung 23.11.2026: Flügelverengung bei AAPL, MRNA, BLK, MSTR"
  risk: "Mehr Varianten = mehr Mehrfachtests; wird über die Benjamini-Hochberg-Korrektur abgefangen."
  status: umgesetzt
  decided_at: "2026-11-23"
  comment: ""
  result: "Umgesetzt 24.11.2026: 8 Backtest-Varianten mit Flügelbreite 1,5 % bzw. 3 % des Kurses (pcs/ccs/ic/ifly _w15/_w30, chain/core/backtest.py). Agent 1 rechnet jeden Trigger zusätzlich auf den Varianten (Feld variants), Agent 3 übernimmt die Kennzahlen der Variante mit der nächstliegenden Live-Flügelbreite (≤ 4,5 %). Befund: schmale Flügel sind deutlich schlechter – T05 pcs OOS Ø +1,7 % je Risiko vs. pcs_w15 −8,7 % (t −4,4), pcs_w30 −2,3 %; T04 ic +0,7 % vs. ic_w15 −7,9 %; T08 ifly +1,0 % vs. ifly_w15 −98 %, ifly_w30 −41 % (Kosten im Median 53 % bzw. 32 % des Risikos). Verengte Live-Trades werden damit wegen negativem Erwartungswert abgelehnt."

